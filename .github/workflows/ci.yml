name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.4.0"
            numpy: "numpy>=1.26,<2"
          - python: "3.12"
            torch: "2.7.1"
            numpy: "numpy>=1.26"
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest "${{ matrix.numpy }}"
      - name: Verify device and runtime contracts
        run: |
          python -m pytest -q tests/test_device.py tests/test_device_release_contracts.py \
            tests/test_vendor_shims.py tests/test_demucs_complex_pad.py \
            tests/test_npu_conv.py tests/test_npu_fft.py \
            tests/test_npu_module_precision.py tests/test_npu_rnn.py \
            tests/test_npu_roformer_regression.py tests/test_roformer_dtype.py \
            tests/test_core_api.py tests/test_runtime_cache.py tests/test_model_detection.py
